<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB HEALTHCARE DEVICES | SURGICAL LIFE CARE EQUIPMENTS</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
 <link rel="stylesheet" href="./404 Error Page.css">
 
</head>
<body>







<section class="error-section">

  <div class="error-card">

    <div class="error-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
      Sorry, the page you are looking for doesn’t exist or may have been moved.
      Search products or go back to the homepage.
    </p>

    <div class="error-search">
      <input type="text" id="errorSearchInput" placeholder="Search healthcare products...">
      <button id="errorSearchBtn">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div class="error-actions">
      <a href="index.html" class="error-btn primary">Back to Home</a>
      <a href="products.html" class="error-btn secondary">View Products</a>
    </div>

  </div>

</section>












<script>

const errorSearchInput = document.getElementById("errorSearchInput");
const errorSearchBtn = document.getElementById("errorSearchBtn");

function goToSearchResults(){
  const value = errorSearchInput.value.trim();

  if(value === ""){
    alert("Please enter a product name.");
    return;
  }

  localStorage.setItem("lastSearch", value);

  window.location.href =
    `search-results.html?q=${encodeURIComponent(value)}`;
}

errorSearchBtn.addEventListener("click", goToSearchResults);

errorSearchInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    goToSearchResults();
  }
});

</script>
</body>
</html>
