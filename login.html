<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB HEALTHCARE DEVICES | SURGICAL LIFE CARE EQUIPMENTS</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="stylesheet" href="./login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>





<section class="login-page">

  <div class="login-card">

   <div class="login-logo">
  <a href="index.html">
    <img src="images/logo.jpeg" alt="SB Healthcare Devices">
  </a>
</div>

    <h2>Welcome Back</h2>
    <p>Login to access your SB Healthcare Devices account.</p>

    <form id="loginForm">

      <div class="login-group">
        <label>Email / Phone Number</label>
        <input type="text" id="loginUser" placeholder="Enter email or phone number" required>
      </div>

      <div class="login-group password-group">
        <label>Password</label>
        <div class="password-box">
          <input type="password" id="loginPassword" placeholder="Enter password" required>
          <i class="fa-regular fa-eye" id="togglePassword"></i>
        </div>
      </div>

      <div class="login-options">
        <label>
          <input type="checkbox">
          Remember Me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

      <div class="create-account">
        Don’t have an account?
        <a href="signup.html">Create Account</a>
      </div>

    </form>

  </div>

</section>












    <script src="./login.js"></script>

</body>
</html>
